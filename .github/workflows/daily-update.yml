  #         XE_ACCOUNT_ID: ${{ secrets.XE_ACCOUNT_ID }}
  #         XE_API_KEY: ${{ secrets.XE_API_KEY }}
  #         EXCHANGERATE_API_KEY: ${{ secrets.EXCHANGERATE_API_KEY }}
  #         # DB_PATH or a Postgres URL, depending on your DB layer
  #       run: npm run update
